<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz — Teorías de la Personalidad</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--tx:#1e1b3a;--mu:#6b6890;--pr:#6d4aff;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#e0dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#201d40;--tx:#eeeaff;--mu:#a9a4d0;--pr:#9b82ff;--okb:#12391f;--nob:#411a1a;--bd:#35315f}}
:root[data-theme="dark"]{--bg:#14122b;--card:#201d40;--tx:#eeeaff;--mu:#a9a4d0;--pr:#9b82ff;--okb:#12391f;--nob:#411a1a;--bd:#35315f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;box-shadow:0 6px 24px rgba(80,60,200,.08)}
h1{font-size:1.7rem;margin:.2em 0 .4em;line-height:1.2}h2{font-size:1.2rem;line-height:1.4;margin:.6em 0 1em}
p{color:var(--mu);margin:.3em 0 1.2em}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font:600 1rem inherit;font-family:inherit;background:var(--pr);color:#fff;cursor:pointer}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:.9rem}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 14px;font-size:.95rem}
.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{border-radius:14px;padding:14px;text-align:center;font-size:.9rem}.stat b{display:block;font-size:1.8rem}
.big{font-size:3rem;font-weight:800;color:var(--pr);text-align:center;margin:0}
.hide{display:none}
</style></head><body><div class="app"><div class="card" id="c"></div></div>
<script>
// [pregunta, correcta, incorrecta1, incorrecta2, explicación]
const Q=[
["Es alegre, sociable, optimista y expresiva, y disfruta convivir con los demás. ¿Qué temperamento describe?","Sanguíneo","Colérico","Flemático","El sanguíneo se vinculaba con la sangre y se expresa de forma alegre y sociable."],
["En la teoría de los cuatro humores, el temperamento colérico se relacionaba con...","La bilis amarilla","La bilis negra","La flema","Colérico: bilis amarilla. Melancólico: bilis negra. Flemático: flema. Sanguíneo: sangre."],
["Ante un conflicto en el equipo, Ana se mantiene tranquila, paciente y evita la discusión. ¿Qué temperamento predomina?","Flemático","Melancólico","Sanguíneo","El flemático es tranquilo, paciente, calmado y suele evitar los conflictos."],
["Dos hermanos reaccionan de forma muy distinta ante el mismo examen. ¿Qué concepto explica esa diferencia?","La personalidad","El individuo","La persona","Personalidad: patrón estable de conducta, pensamiento y afecto que hace reaccionar de manera única ante las situaciones."],
["Un ser humano con conciencia de sí mismo, racionalidad, dignidad y responsabilidad ante la comunidad es descrito por el concepto de...","Persona","Individuo","Personalidad","Persona es un concepto filosófico y social. El individuo es solo la unidad biológica singular, sin implicar necesariamente conciencia social o moral."],
["La palabra personalidad viene del latín personare (per = a través, sonare = sonar). ¿A qué se refería originalmente?","A las máscaras que usaban los actores de teatro","A la voz con que los oradores se dirigían al público","A los rasgos de carácter heredados de la familia","Hacía referencia a las máscaras de los actores en el teatro."],
["¿Quién definió a la persona como «sustancia individual de naturaleza racional»?","Boecio","Hipócrates","Freud","Esa es la definición clásica de Boecio."],
["Según Cruz (2019), la personalidad es...","Un conjunto de patrones de sentimientos, pensamientos, actitudes y conducta que diferencia a cada individuo","Un conjunto de reacciones biológicas heredadas que se manifiesta igual en toda la especie","Un conjunto de normas morales aprendidas que regulan la convivencia dentro de una comunidad","Para Cruz, son los patrones que definen a una persona y nos hacen diferentes de los demás."],
["El estudio de la personalidad proviene de la unión entre...","La filosofía griega antigua y la psicología científica del siglo XX","La medicina medieval y la sociología científica del siglo XIX","La teología romana y la biología evolutiva del siglo XVIII","Así lo anotaste en clase: filosofía griega antigua y psicología científica del siglo XX."],
["En las características ontológicas del ente, ¿qué término latino corresponde a «bueno»?","Bonum","Verum","Unum","Unum = uno, verum = verdadero, bonum = bueno. La cuarta es pulchrum (bello); en tus apuntes dice «bellum», que en latín significa «guerra»."],
["En la analogía del auto, los «neumáticos de la autoestima» son...","Autoimagen, autoconcepto, autopercepción y autorrefuerzo","Apertura, neuroticismo, agradabilidad y conciencia","Sanguíneo, colérico, melancólico y flemático","Los cuatro elementos que sostienen la autoestima en tus apuntes."],
["Luis se angustia con facilidad, se preocupa en exceso y su ánimo cambia ante el estrés. ¿Qué elemento de la personalidad destaca?","Neuroticismo","Apertura a la experiencia","Agradabilidad","El neuroticismo se asocia con inestabilidad emocional, ansiedad y emociones negativas."],
["Freud elaboró su teoría de la personalidad principalmente a partir de...","Estudios de caso con sus pacientes","Experimentos con grupo control","Correlaciones en muestras grandes","Su método principal fue el estudio de caso (método clínico), con sus limitaciones de objetividad y verificación."],
["Un psicólogo examina a fondo a uno o pocos sujetos con diversas técnicas, con fines terapéuticos. ¿Qué tipo de investigación realiza?","Idiográfica","Nomotética","Correlacional","Idiográfica: pocos sujetos a fondo. Nomotética: diferencias estadísticas en grandes grupos."],
["Mientras lees, recuerdas de pronto lo que hiciste anoche. ¿De qué nivel proviene ese recuerdo?","Preconsciente","Consciente","Inconsciente","El preconsciente guarda lo que no está en la conciencia ahora pero se recupera fácilmente."],
["Un bebé llora y exige comida de inmediato, sin considerar nada más. ¿Qué estructura domina su conducta?","El ello","El yo","El superyó","El ello opera con el principio del placer y exige gratificación inmediata."],
["Carlos soporta un empleo que no le gusta porque necesita sustento para su familia. ¿Qué estructura lo guía?","El yo","El superyó","El ello","El yo opera con el principio de realidad: pospone o reencauza los impulsos."],
["¿Qué componente del superyó contiene las conductas por las que el niño fue castigado?","La conciencia","El yo ideal","El proceso primario","La conciencia agrupa lo castigado; el yo ideal, las conductas elogiadas."],
["Sofía siente culpa y vergüenza intensas por un impulso contrario a su código moral, aunque nadie lo supo. ¿Qué tipo de ansiedad es?","Ansiedad moral","Ansiedad neurótica","Ansiedad ante la realidad","Moral: conflicto ello-superyó (miedo a la propia conciencia). Neurótica: conflicto ello-yo."],
["¿Qué mecanismo de defensa se considera el más básico y utilizado?","Represión","Negación","Racionalización","La represión elimina involuntariamente de la conciencia algo que produce dolor o malestar."],
["Un hombre amenazado por sus deseos sexuales encabeza una furibunda cruzada contra la pornografía. ¿Qué mecanismo usa?","Formación reactiva","Proyección","Sublimación","Expresa el impulso contrario al que realmente lo mueve."],
["«No le odio. Él es quien me odia.» ¿Qué mecanismo ilustra?","Proyección","Racionalización","Desplazamiento","Proyección: atribuir a otro un impulso perturbador propio."],
["Tras discutir con su jefe, Ana llega a casa y le grita a su perro. ¿Qué mecanismo usa?","Desplazamiento","Sublimación","Regresión","Desplazamiento: se transfiere el impulso a un objeto sustituto disponible."],
["Una artista transforma su energía instintiva en obras admiradas socialmente. ¿Qué mecanismo usa?","Sublimación","Desplazamiento","Formación reactiva","Sublimación: se modifica el impulso hacia conductas socialmente aceptables."],
["Despedido de su empleo, Raúl dice que «ese trabajo tampoco era tan bueno». ¿Qué mecanismo usa?","Racionalización","Negación","Proyección","Reinterpreta su conducta o situación para que sea más aceptable."],
["Ante una crisis, un adulto actúa de forma pueril y dependiente, como en una etapa anterior. ¿Qué mecanismo usa?","Regresión","Represión","Negación","Regresión: volver a una etapa más placentera y segura de la vida."],
["¿Qué característica comparten todos los mecanismos de defensa?","Distorsionan la realidad y operan de forma inconsciente","Eliminan por completo la ansiedad y operan de forma consciente","Se usan de uno en uno y operan de forma voluntaria","Son distorsiones o negaciones de la realidad y operan inconscientemente; casi siempre usamos varios a la vez."],
["Un adulto es obstinado, avaro, rígido y compulsivamente ordenado. ¿Qué tipo de personalidad describe?","Anal retentiva","Anal agresiva","Fálica","Se origina en retener las heces durante el control de esfínteres. La anal agresiva es desordenada y destructiva."],
["Un niño siente deseo inconsciente por su madre y quiere reemplazar a su padre. ¿Qué concepto freudiano es?","Complejo de Edipo","Complejo de Electra","Ansiedad ante la castración","Ocurre en la etapa fálica (4-5 años). Electra es la versión femenina; la ansiedad ante la castración es el miedo que lo acompaña."],
["¿Cuál de estos periodos NO es una etapa psicosexual, según Freud?","Latencia","Genital","Fálica","En la latencia el instinto sexual está latente y se sublima en la escuela, los deportes y las amistades."],
["Un paciente se bloquea al hablar de un recuerdo doloroso. Freud lo llamó...","Resistencia","Catarsis","Contenido latente","La resistencia indica cercanía con el origen del problema; el análisis debe seguir ahí."],
["En el análisis de los sueños, el significado simbólico oculto se llama...","Contenido latente","Contenido manifiesto","Catarsis","El manifiesto son los hechos reales del sueño; el latente, su significado simbólico."]
];
const c=document.getElementById('c');let qs,i,ok,bad,lock;
const sh=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function home(){c.innerHTML=`<h1>Quiz — Teorías de la Personalidad</h1><p>${Q.length} preguntas basadas en tus apuntes y en el capítulo de Freud (psicoanálisis). Elige A, B o C; verás si acertaste después de responder.</p><button class="btn" id="go">Comenzar</button>`;go.onclick=start}
function start(){qs=sh(Q);i=0;ok=0;bad=0;show()}
function show(){lock=false;const q=qs[i],o=sh([[q[1],1],[q[2],0],[q[3],0]]);
c.innerHTML=`<div class="top"><span>Pregunta ${i+1} de ${qs.length}</span><span>✔ ${ok} · ✘ ${bad}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><h2>${q[0]}</h2><div id="o"></div><div id="f"></div>`;
o.forEach((x,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABC'[k]}</b><span>${x[0]}</span>`;b.onclick=()=>pick(b,x[1]);document.getElementById('o').append(b)})}
function pick(b,right){if(lock)return;lock=true;const bs=[...document.querySelectorAll('.opt')];
bs.forEach(x=>x.disabled=true);right?ok++:bad++;
b.classList.add(right?'ok':'no');
if(!right){const w=bs.find(x=>x.querySelector('span').textContent===qs[i][1]);w.classList.add('ok')}
f.innerHTML=`<div class="fb ${right?'ok':'no'}"><b>${right?'¡Correcto!':'Incorrecto.'}</b> ${qs[i][4]}</div><button class="btn" id="nx">${i+1<qs.length?'Siguiente':'Ver resultados'}</button>`;
nx.onclick=()=>{i++;i<qs.length?show():end()};nx.scrollIntoView({block:'nearest'})}
function end(){const p=Math.round(ok/qs.length*100);
c.innerHTML=`<h1>¡Quiz terminado!</h1><p class="big">${p}%</p><p style="text-align:center">Puntuación final: ${ok} de ${qs.length}</p><div class="stats"><div class="stat" style="background:var(--okb)"><b>${ok}</b>Correctas</div><div class="stat" style="background:var(--nob)"><b>${bad}</b>Incorrectas</div></div><button class="btn" id="re">Volver a intentarlo</button>`;re.onclick=start}
home();
</script></body></html>
